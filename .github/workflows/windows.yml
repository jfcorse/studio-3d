name: Application Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Construire l'installateur et la version portable
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Studio-3D-Windows
          path: dist/*.exe
          if-no-files-found: error

      # Sur un tag vN.N.N, les .exe sont aussi publiés dans une Release GitHub
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
